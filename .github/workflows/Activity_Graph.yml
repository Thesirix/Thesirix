name: "📈 Activity Graph"

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  activity-graph:
    name: "📈 Generate Activity Graph"
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch activity graph source
        run: |
          git fetch origin activity_graph
          mkdir -p activity-graph-src
          for f in $(git ls-tree -r --name-only origin/activity_graph); do
            mkdir -p activity-graph-src/$(dirname $f)
            git show origin/activity_graph:$f > activity-graph-src/$f
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm run build
        working-directory: activity-graph-src

      - name: Generate Activity Graph SVG
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
          PORT: "5100"
        run: |
          cd activity-graph-src
          node dist/main.js &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5100/ && break
            sleep 1
          done
          curl -sf "http://localhost:5100/graph?username=Thesirix&theme=tokyo-night" -o ../activity-graph.svg
          grep -q "<svg" ../activity-graph.svg
          mv ../activity-graph.svg ../assets/activity-graph.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/activity-graph.svg
          if git diff --cached --exit-code; then
            echo "No changes."
          else
            git commit -m "📈 Update activity graph"
            git pull --rebase origin main
            git push origin main
          fi
